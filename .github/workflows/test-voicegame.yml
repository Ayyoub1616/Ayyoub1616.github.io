name: Verify REWIND mini-game collection
on:
  push:
    branches: [main]
    paths:
      - 'voicegame/**'
      - '.github/workflows/test-voicegame.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed game collection
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ayyoub1616.github.io/voicegame'
          for attempt in {1..30}; do
            if curl -fsSL --max-time 15 "$BASE/" -o /tmp/index.html &&
              grep -q 'id="gameSelect"' /tmp/index.html &&
              grep -q 'id="chainPlayers"' /tmp/index.html &&
              grep -q 'id="winnerPanel"' /tmp/index.html &&
              curl -fsSL --max-time 15 "$BASE/games.js" -o /tmp/games.js &&
              grep -q '"id":"chain"' /tmp/games.js &&
              grep -q '"id":"duel"' /tmp/games.js &&
              curl -fsSL --max-time 15 "$BASE/app.js" -o /tmp/app.js &&
              grep -q 'function nextInChain' /tmp/app.js &&
              grep -q 'linkedMode' /tmp/app.js &&
              curl -fsSL --max-time 15 "$BASE/i18n.js" -o /tmp/i18n.js &&
              curl -fsSL --max-time 15 "$BASE/styles.css" -o /tmp/styles.css; then
              for code in /tmp/app.js /tmp/games.js /tmp/i18n.js; do node --check "$code"; done
              echo 'PASS: 15-game collection public and valid'
              exit 0
            fi
            echo "Waiting for new release $attempt/30"
            sleep 4
          done
          echo 'FAIL: Site was not deployed'
          exit 1
      - name: Validate all 15 game definitions
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('/tmp/games.js','utf8');
          const games=JSON.parse(s.match(/const GAMES=(.*?);\n const META=/s)[1]);
          const meta=JSON.parse(s.match(/const META=(.*?);\n const locale=/s)[1]);
          if(games.length!==15)throw Error('Expected 15 games, got '+games.length);
          for(const g of games)for(const l of ['es','en','fr','ar','pt']){
            if(g[l]?.length!==3||g[l][2].length<3)throw Error('Missing '+g.id+' '+l);
          }
          for(const l of ['es','en','fr','ar','pt'])if(!meta[l]?.passNext||!meta[l]?.duelReveal)throw Error('Incomplete '+l);
          console.log('PASS: all modes and prompt suggestions translated into five languages');
          NODE
      - name: Install Playwright
        run: npm install --prefix /tmp/rewind-e2e --no-audit --no-fund playwright@1.56.1
      - name: Test classic, voice chain, duel, and automatic locale
        shell: bash
        run: |
          cat > /tmp/rewind-e2e/test.cjs <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox','--use-fake-device-for-media-stream','--use-fake-ui-for-media-stream','--autoplay-policy=no-user-gesture-required']});
            const context=await browser.newContext({permissions:['microphone'],locale:'fr-FR'});
            const page=await context.newPage();const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('dialog',dialog=>dialog.accept());
            await page.goto('https://ayyoub1616.github.io/voicegame/?game=chain',{waitUntil:'networkidle',timeout:30000});
            if(await page.locator('#gameSelect').inputValue()!=='chain')throw Error('Direct game link failed');
            if(await page.locator('.tile').count()!==3)throw Error('Missing simple three-button interface');
            if(!((await page.locator('#gameDescription').textContent()).includes('amis')))throw Error('French translation not applied');
            await page.selectOption('#languageSelect','es');
            await page.selectOption('#chainPlayers','3');
            const capture=async()=>{
              await page.locator('#recordButton').click();
              await page.waitForFunction(()=>document.querySelector('#recordLabel').textContent==='Detener grabación',{timeout:18000});
              await page.waitForTimeout(1400);
              await page.locator('#recordButton').click();
              await page.waitForFunction(()=>document.querySelector('#recordLabel').textContent!=='Detener grabación'&&!document.querySelector('#recordButton').disabled,{timeout:20000});
            };
            const checkAudio=async()=>page.waitForFunction(()=>{const a=document.querySelector('audio');return a&&!a.paused&&a.currentTime>.04},{timeout:7000});
            await capture();
            await page.locator('#reverseButton').click();
            await page.locator('#handoff').waitFor({state:'visible'});
            await page.locator('#rivalReadyButton').click();
            await page.locator('#originalButton').click();await checkAudio();
            await capture();
            await page.locator('#nextChainButton').click();
            await page.locator('#handoff').waitFor({state:'visible'});
            await page.locator('#rivalReadyButton').click();
            if(!((await page.locator('#stageBadge').textContent()).includes('3 / 3')))throw Error('Third player label wrong');
            await page.locator('#originalButton').click();await checkAudio();
            await capture();
            await page.locator('#revealButton').click();
            await page.waitForFunction(()=>document.querySelector('#stageBadge').textContent.includes('REVELACIÓN'));
            if(await page.locator('.chain-row').count()!==3)throw Error('Missing 3-player replay timeline');
            await page.locator('#newRoundButton').click();
            await page.selectOption('#gameSelect','duel');
            await page.waitForFunction(()=>document.querySelector('#gameSelect').value==='duel');
            await capture();
            await page.locator('#reverseButton').click();
            await page.locator('#rivalReadyButton').click();
            await page.locator('#originalButton').click();await checkAudio();
            await capture();
            await page.locator('#revealButton').click();
            if(!await page.locator('#winnerPanel').isVisible())throw Error('Duel vote unavailable');
            await page.locator('#winnerTwo').click();
            if(!((await page.locator('#winnerResult').textContent()).includes('jugador 2')))throw Error('Duel winner not recorded');
            await page.selectOption('#gameSelect','speed');
            if(await page.locator('#gameSelect').inputValue()!=='speed')throw Error('Speed game selection failed');
            await page.selectOption('#languageSelect','ar');
            if(await page.locator('html').getAttribute('dir')!=='rtl')throw Error('Arabic RTL not active');
            await page.reload({waitUntil:'networkidle'});
            if(await page.locator('#languageSelect').inputValue()!=='ar')throw Error('Manual language preference not saved');
            if(errors.length)throw Error('Page errors '+errors.join('; '));
            console.log('PASS: 3-player chain, previous audio playback, reveal timeline, duel vote, speed mode, Arabic RTL, shared game link');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/rewind-e2e/test.cjs
