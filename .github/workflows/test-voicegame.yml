name: Verify VoiceGame published website
on:
  push:
    branches: [main]
    paths:
      - 'voicegame/**'
      - '.github/workflows/test-voicegame.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check live website files over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ayyoub1616.github.io/voicegame'
          for attempt in {1..15}; do
            if curl --fail --silent --show-error --location --max-time 15 "$BASE/" -o /tmp/voicegame.html &&
              grep -q 'REWIND!' /tmp/voicegame.html &&
              curl --fail --silent --show-error --location --max-time 15 "$BASE/app.js" -o /tmp/voicegame.js &&
              grep -q 'Escuchar original' /tmp/voicegame.js &&
              grep -q 'Escuchar en reversa' /tmp/voicegame.js &&
              curl --fail --silent --show-error --location --max-time 15 "$BASE/styles.css" -o /tmp/voicegame.css &&
              curl --fail --silent --show-error --location --max-time 15 "$BASE/assets/icon.svg" -o /tmp/voicegame-icon.svg; then
              echo 'PASS: live VoiceGame HTML, JS, CSS and icon available via HTTPS'
              exit 0
            fi
            echo "Checking publication: attempt $attempt/15"
            sleep 4
          done
          echo 'FAIL: Website not yet publicly accessible'
          exit 1
