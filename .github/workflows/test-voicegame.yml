name: Verify VoiceGame public website

on:
  push:
    branches: [main]
    paths:
      - 'voicegame/**'
      - '.github/workflows/test-voicegame.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify published game in HTTPS
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ayyoub1616.github.io/voicegame'
          for attempt in {1..20}; do
            if curl -fsSL --max-time 15 "$BASE/" -o /tmp/voicegame.html &&
              grep -q 'id="recordButton"' /tmp/voicegame.html &&
              grep -q 'id="playOriginal"' /tmp/voicegame.html &&
              grep -q 'id="playReverse"' /tmp/voicegame.html &&
              ! grep -q 'id="player-name"' /tmp/voicegame.html &&
              ! grep -q 'id="score-board"' /tmp/voicegame.html &&
              ! grep -q 'scoring.js' /tmp/voicegame.html &&
              curl -fsSL --max-time 15 "$BASE/app.js" -o /tmp/voicegame.js &&
              grep -q 'reverseAudio' /tmp/voicegame.js &&
              grep -q 'MediaRecorder' /tmp/voicegame.js &&
              curl -fsSL --max-time 15 "$BASE/styles.css" -o /tmp/voicegame.css &&
              grep -q 'record-button' /tmp/voicegame.css &&
              curl -fsSL --max-time 15 "$BASE/sw.js" -o /tmp/voicegame-sw.js &&
              ! grep -q 'scoring.js' /tmp/voicegame-sw.js; then
              node --check /tmp/voicegame.js
              node --check /tmp/voicegame-sw.js
              echo 'PASS: one-button recorder, original/reverse controls, no user/scoring UI'
              exit 0
            fi
            echo "Waiting for simple VoiceGame: $attempt/20"
            sleep 4
          done
          echo 'FAIL: New public game unavailable'
          exit 1
