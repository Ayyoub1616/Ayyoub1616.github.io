name: Verify REWIND audio and viral video

on:
  push:
    branches: [main]
    paths:
      - 'voicegame/**'
      - '.github/workflows/test-voicegame.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check published website and audio features over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ayyoub1616.github.io/voicegame'
          for attempt in {1..30}; do
            if curl -fsSL --max-time 15 "$BASE/" -o /tmp/voicegame.html &&
              grep -q 'id="recordButton"' /tmp/voicegame.html &&
              grep -q 'id="cleanToggle"' /tmp/voicegame.html &&
              grep -q 'id="selfieToggle"' /tmp/voicegame.html &&
              grep -q 'id="shareTikTok"' /tmp/voicegame.html &&
              grep -q 'id="saveAudio"' /tmp/voicegame.html &&
              ! grep -q 'id="player-name"' /tmp/voicegame.html &&
              ! grep -q 'id="score-board"' /tmp/voicegame.html &&
              curl -fsSL --max-time 15 "$BASE/app.js" -o /tmp/voicegame.js &&
              grep -q 'reverseBuffer' /tmp/voicegame.js &&
              grep -q 'noiseSuppression' /tmp/voicegame.js &&
              grep -q 'OfflineAudioContext' /tmp/voicegame.js &&
              grep -q 'captureStream' /tmp/voicegame.js &&
              curl -fsSL --max-time 15 "$BASE/styles.css" -o /tmp/voicegame.css &&
              grep -q 'share-zone' /tmp/voicegame.css; then
              node --check /tmp/voicegame.js
              echo "PASS: live REWIND, noise filter, video sharing, original and reverse"
              exit 0
            fi
            echo "Waiting for Pages release, attempt $attempt/30"
            sleep 4
          done
          echo "FAIL: New public game has not propagated"
          exit 1
      - name: Install browser test helper
        run: npm install --prefix /tmp/voicegame-e2e --no-audit --no-fund playwright@1.56.1
      - name: Exercise microphone and audio playback in headless Chrome
        shell: bash
        run: |
          cat > /tmp/voicegame-e2e/test.cjs <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox','--use-fake-device-for-media-stream','--use-fake-ui-for-media-stream','--autoplay-policy=no-user-gesture-required']});
            const context=await browser.newContext({permissions:['microphone','camera'],acceptDownloads:true});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('https://ayyoub1616.github.io/voicegame/',{waitUntil:'networkidle',timeout:30000});
            await page.locator('#recordButton').click();
            await page.waitForFunction(()=>document.getElementById('recordText').textContent==='DETENER',{timeout:15000});
            await page.waitForTimeout(1700);
            await page.locator('#recordButton').click();
            await page.locator('#playPanel').waitFor({state:'visible',timeout:18000});
            await page.locator('#playOriginal').click();
            await page.waitForTimeout(250);
            await page.locator('#playReverse').click();
            await page.waitForTimeout(300);
            await page.locator('#cleanToggle').click();
            await page.locator('#playPanel').waitFor({state:'visible',timeout:18000});
            await page.locator('#clipNormal').click();
            const download=page.waitForEvent('download',{timeout:30000});
            await page.locator('#makeVideo').click();
            const file=await download;
            if(!/\.(mp4|webm)$/.test(file.suggestedFilename()))throw Error('Video filename incorrect: '+file.suggestedFilename());
            // Selfie path: verify fake front-camera recording and video creation.
            await page.locator('#selfieToggle').click();
            await page.locator('#recordButton').click();
            await page.waitForFunction(()=>document.getElementById('recordText').textContent==='DETENER',{timeout:15000});
            await page.waitForTimeout(1600);
            await page.locator('#recordButton').click();
            await page.locator('#playPanel').waitFor({state:'visible',timeout:18000});
            await page.locator('#selfieBox').waitFor({state:'visible',timeout:18000});
            await page.locator('#clipReverse').click();
            const selfieDownload=page.waitForEvent('download',{timeout:30000});
            await page.locator('#makeVideo').click();
            const second=await selfieDownload;
            if(!/\.(mp4|webm)$/.test(second.suggestedFilename()))throw Error('Selfie video filename incorrect: '+second.suggestedFilename());
            const failure=await page.locator('#errorMessage').textContent();
            if(failure?.trim())throw Error('Page error: '+failure);
            if(errors.length)throw Error('JavaScript page errors: '+errors.join('; '));
            console.log('PASS: microphone, clean audio, normal/reverse playback, animated vertical video and selfie video '+file.suggestedFilename());
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/voicegame-e2e/test.cjs
