name: Verify REWIND clear rules and stable turns
on:
  push:
    branches: [main]
    paths:
      - 'voicegame/**'
      - '.github/workflows/test-voicegame.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for published v13 and inspect syntax
        shell: bash
        run: |
          set -euo pipefail
          URL='https://ayyoub1616.github.io/voicegame'
          for attempt in {1..36}; do
            if curl -fsSL --max-time 15 "$URL/index.html" -o /tmp/game.html &&
              grep -q 'id="gameTiles"' /tmp/game.html &&
              grep -q 'id="handoff"' /tmp/game.html &&
              curl -fsSL --max-time 15 "$URL/games.js" -o /tmp/games.js &&
              grep -q 'const GUIDES=' /tmp/games.js &&
              curl -fsSL --max-time 15 "$URL/app.js" -o /tmp/app.js &&
              grep -q 'function renderParty' /tmp/app.js &&
              grep -q 'resetRound(false)' /tmp/app.js &&
              ! grep -q 'window.confirm' /tmp/app.js &&
              curl -fsSL --max-time 15 "$URL/styles.css" -o /tmp/styles.css &&
              grep -q 'body.party-mode .tiles' /tmp/styles.css &&
              curl -fsSL --max-time 15 "$URL/sw.js" -o /tmp/sw.js &&
              grep -q 'rewind-ux-clear-v14' /tmp/sw.js; then
              node --check /tmp/games.js
              node --check /tmp/app.js
              node --check /tmp/sw.js
              echo 'PASS: stable live release v13'
              exit 0
            fi
            echo "Waiting for deployment $attempt/36"
            sleep 4
          done
          echo "FAIL: expected release never became live"
          exit 1
      - name: Verify descriptions and modes in five languages
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),txt=fs.readFileSync('/tmp/games.js','utf8');
          const games=JSON.parse(txt.match(/const GAMES=(.*?);\n const META=/s)[1]);
          const guides=JSON.parse(txt.match(/const GUIDES=(.*?);\n const VERBS=/s)[1]);
          if(games.length!==14)throw Error('Expected 14 non-repetitive games');
          for(const l of ['es','en','fr','ar','pt']){
            for(const g of games)if(!guides[l]?.[g.id]||!g[l]?.[1])throw Error('Missing guide '+g.id+' '+l);
          }
          if(games.filter(g=>g.kind==='party').length!==11)throw Error('Expected 11 no-mic games');
          console.log('PASS: game-specific instructions in five languages');
          NODE
      - name: Install Playwright browser runner
        run: npm install --prefix /tmp/rewind-e2e --no-audit --no-fund playwright@1.56.1
      - name: Test each party mode and audio handoff on phone viewport
        shell: bash
        run: |
          cat > /tmp/rewind-e2e/test.cjs <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox','--use-fake-device-for-media-stream','--use-fake-ui-for-media-stream','--autoplay-policy=no-user-gesture-required']});
            const ctx=await browser.newContext({viewport:{width:390,height:844},locale:'es-ES',permissions:['microphone']});
            const page=await ctx.newPage(),errors=[],dialogs=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('dialog',d=>{dialogs.push(d.type()+': '+d.message());d.dismiss()});
            await page.goto('https://ayyoub1616.github.io/voicegame/?game=mostlikely',{waitUntil:'networkidle',timeout:30000});
            if(await page.locator('#gameSelect option').count()!==14)throw Error('Game selector count incorrect');
            if(await page.locator('#originalButton').isVisible())throw Error('Talk mode has useless third action');
            if(await page.locator('#roundTop').isVisible())throw Error('Redundant stage header in party mode');
            if(!await page.locator('#partyBoard').isVisible())throw Error('Party question missing');
            await page.locator('#playerNamesPanel').evaluate(el=>el.open=true);
            await page.selectOption('#chainPlayers','3');
            await page.locator('.player-name-field input').nth(0).fill('Ana');
            await page.locator('.player-name-field input').nth(1).fill('Sara');
            await page.locator('.player-name-field input').nth(2).fill('Luis');
            const checkNoOverflow=async game=>{
              if(await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+2))throw Error('Mobile horizontal overflow: '+game);
              if(!((await page.locator('#partyDirections').textContent()).length>30))throw Error('No explicit help '+game);
            };
            const first=await page.locator('#partyQuestion').textContent();
            await page.locator('#recordButton').click();
            if((await page.locator('#partyQuestion').textContent())===first)throw Error('New card does not change');
            await page.locator('#reverseButton').click();
            if(!((await page.locator('#partyPlayer').textContent()).includes('Sara')))throw Error('Next player name missing');
            if(dialogs.length)throw Error('Unexpected popup when passing turn: '+dialogs);
            for(const game of ['wouldyou','never','story','twotruths']){
              await page.selectOption('#gameSelect',game);
              if(await page.locator('#originalButton').isVisible())throw Error('Useless middle button: '+game);
              await checkNoOverflow(game);
            }
            await page.selectOption('#gameSelect','story');
            const story=await page.locator('#partyQuestion').textContent();
            await page.locator('#reverseButton').click();
            if((await page.locator('#partyQuestion').textContent())!==story)throw Error('Story changed when adding next person');
            await page.selectOption('#gameSelect','truthdare');
            const truth=await page.locator('#partyQuestion').textContent();
            await page.locator('#originalButton').click();
            if((await page.locator('#partyQuestion').textContent())===truth)throw Error('Truth/dare not switched');
            await checkNoOverflow('truthdare');
            await page.selectOption('#gameSelect','emojiquiz');
            await page.locator('#originalButton').click();
            if(!await page.locator('#partyAnswer').isVisible())throw Error('Emoji answer not revealed');
            await page.selectOption('#gameSelect','knowme');
            const score=await page.locator('#partyScore').textContent();
            await page.locator('#originalButton').click();
            if((await page.locator('#partyScore').textContent())===score)throw Error('Couple score did not increase');
            for(const game of ['charades','fivewords','taboo']){
              await page.selectOption('#gameSelect',game);
              await checkNoOverflow(game);
              await page.locator('#originalButton').click();
              await page.waitForTimeout(1400);
              if(!await page.locator('#partyTimerPanel').isVisible())throw Error('Timer missing '+game);
              const time=Number(await page.locator('#partyTimerValue').textContent());
              if(time>=Number(game==='fivewords'?5:game==='charades'?30:40))throw Error('Timer not running '+game);
              await page.locator('#originalButton').click();
            }
            await page.selectOption('#gameSelect','chain');
            await page.selectOption('#chainPlayers','3');
            await page.locator('#playerNamesPanel').evaluate(el=>el.open=true);
            const inputs=page.locator('.player-name-field input');
            await inputs.nth(0).fill('Ana');
            await inputs.nth(1).fill('Sara');
            await inputs.nth(2).fill('Luis');
            const record=async()=>{
              await page.locator('#recordButton').click();
              await page.waitForFunction(()=>document.querySelector('#recordLabel').textContent==='Detener grabación',{timeout:15000});
              await page.waitForTimeout(1450);
              await page.locator('#recordButton').click();
              await page.waitForFunction(()=>!document.querySelector('#recordButton').disabled,{timeout:25000});
            };
            await record();
            await page.locator('#reverseButton').click();
            if(!await page.locator('#handoff').isVisible())throw Error('Inline handoff missing');
            if(await page.locator('#gameTiles').isVisible())throw Error('Recording controls visible before recipient is ready');
            if(await page.locator('#handoff').evaluate(e=>getComputedStyle(e).position)!=='static')throw Error('Turn card is still a fixed popup');
            if(!((await page.locator('#handoffTitle').textContent()).includes('Sara')))throw Error('Next voice player not named');
            if(dialogs.length)throw Error('Native blocking popup happened');
            await page.locator('#rivalReadyButton').click();
            if(!await page.locator('#gameTiles').isVisible())throw Error('Controls not restored');
            await page.locator('#originalButton').click();
            await page.waitForFunction(()=>{const a=document.querySelector('audio');return a&&!a.paused&&a.currentTime>.04},{timeout:8000});
            await record();
            await page.locator('#nextChainButton').click();
            if(!((await page.locator('#handoffTitle').textContent()).includes('Luis')))throw Error('Third player handoff missing');
            await page.locator('#rivalReadyButton').click();
            await record();
            await page.locator('#revealButton').click();
            if(await page.locator('.chain-row').count()!==3)throw Error('Voice chain missing');
            await page.selectOption('#gameSelect','duel');
            if(dialogs.length)throw Error('Game selector opens a blocking confirmation');
            await page.selectOption('#languageSelect','ar');
            if(await page.locator('html').getAttribute('dir')!=='rtl')throw Error('Arabic RTL missing');
            if(errors.length)throw Error('Page JavaScript errors: '+errors.join('; '));
            console.log('PASS: 11 clear party modes, timers, scoring, no popups, 3-person voice chain, audio and RTL');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/rewind-e2e/test.cjs
